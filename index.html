<!doctype html>
<html lang="en" class="scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Chamara Perera — Software Engineer Portfolio</title>
    <meta name="description" content="Portfolio of Chamara Perera, Software Engineer and IT Undergraduate specializing in full-stack web development, system architecture, and AI solutions." />
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  </head>
  <body class="bg-zinc-50 dark:bg-[#090d16] text-zinc-800 dark:text-zinc-100 selection:bg-indigo-500/20 selection:text-indigo-400 font-sans antialiased">
    <!-- Loader Spinner -->
    <div id="global-loader" style="position:fixed;z-index:9999;inset:0;display:flex;align-items:center;justify-content:center;background:#090d16;transition:opacity 0.4s ease;">
      <div style="width:56px;height:56px;display:inline-block;">
        <svg viewBox="0 0 50 50" style="width:100%;height:100%;animation:spin 0.8s linear infinite;">
          <circle cx="25" cy="25" r="20" fill="none" stroke="#6366f1" stroke-width="4" stroke-linecap="round" stroke-dasharray="31.4 31.4"/>
        </svg>
      </div>
    </div>
    <style>
      @keyframes spin { 100% { transform: rotate(360deg); } }
    </style>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    <script>
      // Set loader background based on theme
      function setLoaderBg() {
        const loader = document.getElementById('global-loader');
        if (!loader) return;
        let theme = localStorage.theme;
        if (!theme) {
          theme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        }
        loader.style.background = theme === 'dark' ? '#090d16' : '#fafafa';
      }
      setLoaderBg();
      // Listen for theme changes (from React)
      window.addEventListener('storage', setLoaderBg);
      // Disable Print Screen key
      window.addEventListener('keydown', function(e) {
        if (e.key === 'PrintScreen' || e.keyCode === 44) {
          e.preventDefault();
          return false;
        }
      }, true);
      // Hide loader when React is ready
      window.addEventListener('DOMContentLoaded', function() {
        const root = document.getElementById('root');
        if (root) {
          const observer = new MutationObserver(() => {
            if (root.childNodes.length > 0) {
              const loader = document.getElementById('global-loader');
              if (loader) {
                loader.style.opacity = '0';
                setTimeout(() => loader.remove(), 400);
              }
              observer.disconnect();
            }
          });
          observer.observe(root, { childList: true });
        }
      });
    </script>
  </body>
</html>
