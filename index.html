<!doctype html>
<html lang="en" class="scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Chamara Perera — Software Engineer Portfolio</title>
    <meta name="description" content="Portfolio of Chamara Perera, Software Engineer and IT Undergraduate specializing in full-stack web development, system architecture, and AI solutions." />
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  </head>
  <body class="bg-zinc-50 dark:bg-[#090d16] text-zinc-800 dark:text-zinc-100 selection:bg-indigo-500/20 selection:text-indigo-400 font-sans antialiased">
    <!-- Global Page Loader -->
    <div id="global-loader" style="position:fixed;z-index:9999;inset:0;display:flex;align-items:center;justify-content:center;background:#090d16;transition:background 0.4s ease, opacity 0.45s ease;overflow:hidden;">
      <div id="loader-brand" style="display:flex;align-items:center;gap:10px;transition:transform 0.45s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.45s ease;will-change:transform, opacity;">
        <div style="position:relative;width:52px;height:52px;display:flex;align-items:center;justify-content:center;shrink:0;">
          <!-- Animated Hexagon Loading Outline -->
          <svg viewBox="0 0 48 48" style="position:absolute;inset:0;width:100%;height:100%;pointer-events:none;">
            <path d="M 24 3 L 42 13.5 L 42 34.5 L 24 45 L 6 34.5 L 6 13.5 Z" fill="none" stroke="rgba(148, 163, 184, 0.2)" stroke-width="2" stroke-linejoin="round" />
            <path d="M 24 3 L 42 13.5 L 42 34.5 L 24 45 L 6 34.5 L 6 13.5 Z" fill="none" stroke="url(#loader-hex-grad)" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="35 91" style="animation: hexDashLoader 2s linear infinite;" />
            <defs>
              <linearGradient id="loader-hex-grad" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" stop-color="#6366f1" />
                <stop offset="50%" stop-color="#38bdf8" />
                <stop offset="100%" stop-color="#a855f7" />
              </linearGradient>
            </defs>
          </svg>

          <!-- Ambient Hexagon Glow -->
          <div style="position:absolute;inset:4px;background:rgba(99,102,241,0.18);filter:blur(8px);clip-path:polygon(50% 0%, 100% 25%, 100% 75%, 50% 100%, 0% 75%, 0% 25%);animation:pulse 2s ease-in-out infinite;"></div>

          <!-- Logo Image -->
          <img src="/logo.png" alt="Chamara Perera Logo" style="width:40px;height:40px;object-fit:contain;position:relative;z-index:10;filter:drop-shadow(0 2px 8px rgba(99,102,241,0.3));animation:logoPulse 2s ease-in-out infinite;" />
        </div>

        <!-- Brand Text: Chamara Perera -->
        <span id="loader-text" style="font-family:'JetBrains Mono',monospace;font-size:14px;font-weight:600;letter-spacing:-0.02em;color:#090d16;white-space:nowrap;">
          Chamara Perera
        </span>
      </div>
    </div>
    <style>
      @keyframes hexDashLoader {
        0% { stroke-dashoffset: 0; }
        100% { stroke-dashoffset: -126; }
      }
      @keyframes logoPulse {
        0%, 100% { transform: scale(1); filter: drop-shadow(0 2px 8px rgba(99,102,241,0.3)); }
        50% { transform: scale(1.04); filter: drop-shadow(0 4px 14px rgba(99,102,241,0.6)); }
      }
      @keyframes pulse {
        0%, 100% { opacity: 0.5; }
        50% { opacity: 1; }
      }
    </style>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    <script>
      // Set loader background and text color based on theme
      function setLoaderBg() {
        const loader = document.getElementById('global-loader');
        const loaderText = document.getElementById('loader-text');
        if (!loader) return;
        let theme = localStorage.theme;
        if (!theme) {
          theme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        }
        const isDark = theme === 'dark';
        loader.style.background = isDark ? '#090d16' : '#ffffff';
        if (loaderText) {
          loaderText.style.color = isDark ? '#ffffff' : '#090d16';
        }
      }
      setLoaderBg();
      window.addEventListener('storage', setLoaderBg);

      // Disable Print Screen key
      window.addEventListener('keydown', function(e) {
        if (e.key === 'PrintScreen' || e.keyCode === 44) {
          e.preventDefault();
          return false;
        }
      }, true);

      // Instant glide brand loader into Navbar position as soon as navbar-brand mounts
      function dismissLoader() {
        const loader = document.getElementById('global-loader');
        const loaderBrand = document.getElementById('loader-brand');
        if (!loader || loader.dataset.dismissed === "done") return;

        const navBrand = document.getElementById('navbar-brand');
        if (!navBrand) {
          // Retry every 15ms until React mounts navbar-brand
          setTimeout(dismissLoader, 15);
          return;
        }

        loader.dataset.dismissed = "done";

        const navRect = navBrand.getBoundingClientRect();
        const brandRect = loaderBrand.getBoundingClientRect();
        const deltaX = navRect.left - brandRect.left;
        const deltaY = navRect.top - brandRect.top;

        loaderBrand.style.transform = `translate(${deltaX}px, ${deltaY}px)`;

        setTimeout(function() {
          if (navBrand) {
            navBrand.classList.remove('opacity-0');
            navBrand.style.opacity = '1';
          }
        }, 320);

        loader.style.background = 'transparent';
        loader.style.opacity = '0';
        loader.style.pointerEvents = 'none';

        setTimeout(function() {
          if (loader) loader.remove();
        }, 420);
      }

      dismissLoader();
      window.addEventListener('DOMContentLoaded', dismissLoader);
      window.addEventListener('load', dismissLoader);
    </script>
  </body>
</html>
